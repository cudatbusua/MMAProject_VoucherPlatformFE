# Local development only. Bound to loopback; no public access.
services:
  mongo:
    image: mongo:8.0.15
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - voucher_mongo_data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status() } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0,host:'localhost:27017'}]}) }",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  voucher_mongo_data:
